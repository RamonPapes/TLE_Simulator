[project]
name = "my-pass-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ramon Enrico Alves Papes", email = "ramon.papes@fieb.org.br" }
]
requires-python = ">=3.10"
dependencies = [
    "certifi>=2024.7.4",
    "numpy<2",
    "passpredict>=0.5.1",
]

[project.scripts]
my-pass-prediction = "my_pass_prediction:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: propaga com SGP4; mais lento, mas não usa rede",
]

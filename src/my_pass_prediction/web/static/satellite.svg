<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Satélite">
  <!-- Vista de cima, simétrica de propósito: o marcador não gira com a
       direção de voo, e um desenho simétrico não parece torto em
       nenhuma das direções da ground track.

       O translate centra o desenho no viewBox: sem ele o conteúdo fica
       na metade de cima (centro em 0.39 da altura) e o marcador
       apareceria acima da coordenada real. -->
  <g transform="translate(0 7.2)">
  <g stroke="#0b1018" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- mastro entre os painéis -->
    <path d="M14 32h36" stroke-width="5.5" />
    <path d="M14 32h36" stroke="#b9c7d8" stroke-width="2.4" />

    <!-- painéis solares -->
    <rect x="1.5" y="22" width="17" height="20" rx="1.8" fill="#3d7fd6" />
    <rect x="45.5" y="22" width="17" height="20" rx="1.8" fill="#3d7fd6" />

    <!-- corpo -->
    <rect x="23" y="20" width="18" height="24" rx="3" fill="#ff5a5f" />

    <!-- antena -->
    <path d="M32 20v-6" stroke-width="5" />
    <path d="M32 20v-6" stroke="#b9c7d8" stroke-width="2.2" />
    <ellipse cx="32" cy="10" rx="7.5" ry="4.5" fill="#e6edf5" />
  </g>

  <!-- células dos painéis e brilho do corpo, sem contorno próprio -->
  <g stroke="#0b1018" stroke-width="1.1" opacity="0.45">
    <path d="M7 22v20M12.5 22v20M51 22v20M56.5 22v20M1.5 32h17M45.5 32h17" />
  </g>
  <rect x="26" y="24" width="5" height="16" rx="2" fill="#fff" opacity="0.28" />
  </g>
</svg>

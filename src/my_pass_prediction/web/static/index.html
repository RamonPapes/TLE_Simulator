<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador de passagem — TLE sintético</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <aside id="panel">
    <header>
      <h1>Passagem simulada</h1>
      <button id="toggle-panel" type="button" title="Recolher painel">−</button>
    </header>

    <form id="params">
      <fieldset>
        <legend>Estação em solo</legend>
        <label>Nome <input name="name" type="text" value="Salvador" maxlength="64" /></label>
        <div class="row">
          <label>Latitude <input name="lat" type="number" step="0.0001" min="-90" max="90" value="-12.9777" required /></label>
          <label>Longitude <input name="lon" type="number" step="0.0001" min="-180" max="180" value="-38.5016" required /></label>
        </div>
        <p class="hint">Clique no mapa para mover a estação.</p>
      </fieldset>

      <fieldset>
        <legend>Órbita</legend>
        <label>Época (UTC) — instante do zênite
          <input name="epoch" type="datetime-local" step="1" value="2026-09-18T12:00:00" required />
        </label>
        <div class="row">
          <label>Altitude (km) <input name="altitude_km" type="number" step="10" min="150" max="2000" value="500" required /></label>
          <label>Azimute (°) <input name="bearing_deg" type="number" step="5" min="0" max="360" value="200" required /></label>
        </div>
        <p class="hint">Azimute é a direção da ground track sobre a estação: 200° desce para o sul-sudoeste, 20° sobe para o norte-nordeste.</p>
      </fieldset>

      <fieldset>
        <legend>Amostragem</legend>
        <div class="row">
          <label>Passo (s) <input name="step_s" type="number" step="1" min="1" max="300" value="10" required /></label>
          <label>Folga (s) <input name="pad_s" type="number" step="10" min="0" max="1800" value="120" required /></label>
        </div>
      </fieldset>

      <button id="simulate" type="submit">Simular passagem</button>
    </form>

    <p id="error" hidden></p>

    <section id="results" hidden>
      <dl id="summary"></dl>
      <details>
        <summary>TLE gerado</summary>
        <pre id="tle"></pre>
        <button id="copy-tle" type="button">Copiar</button>
      </details>
    </section>
  </aside>

  <div id="playback" hidden>
    <button id="play" type="button" title="Reproduzir">▶</button>
    <input id="slider" type="range" min="0" max="0" value="0" step="1" />
    <span id="readout">—</span>
    <label id="speed-label">Velocidade
      <select id="speed">
        <option value="1">1×</option>
        <option value="5">5×</option>
        <option value="10" selected>10×</option>
        <option value="30">30×</option>
        <option value="60">60×</option>
      </select>
    </label>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
